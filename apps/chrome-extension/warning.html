<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site blocked · TrustLine</title>
    <link rel="stylesheet" href="warning.css" />
  </head>
  <body data-status="dangerous">
    <main class="panel">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 2 4 5v6c0 5.1 3.4 9.4 8 11 4.6-1.6 8-5.9 8-11V5l-8-3Z" />
          <path d="m9.5 9.5 5 5M14.5 9.5l-5 5" />
        </svg>
      </div>
      <p class="eyebrow">TrustLine blocked this page</p>
      <h1 id="title">This site may be dangerous</h1>
      <p class="lead">
        TrustLine flagged <strong id="domain">this site</strong> before it finished loading.
        Attackers can use sites like this to steal passwords, payment details, or install malware.
      </p>

      <dl class="facts">
        <div>
          <dt>Trust score</dt>
          <dd><span id="score">--</span><span class="muted">/100</span></dd>
        </div>
        <div>
          <dt>Reason</dt>
          <dd id="reason">Flagged by TrustLine</dd>
        </div>
        <div>
          <dt>Address</dt>
          <dd class="mono" id="url"></dd>
        </div>
      </dl>

      <div class="actions">
        <button type="button" class="primary" id="back">Back to safety</button>
        <button type="button" class="ghost" id="proceed">Continue anyway</button>
      </div>
    </main>
    <script src="warning.js"></script>
  </body>
</html>
